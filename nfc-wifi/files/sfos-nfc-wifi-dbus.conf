<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- sfos-nfc-wifi: lipstick owns the name, nfcd calls it when a Wi-Fi tag is read.
     Installed as /etc/dbus-1/system.d/sfos-nfc-wifi.conf -->
<busconfig>
    <policy user="defaultuser">
        <allow own="org.jmpx448.nfcwifi"/>
    </policy>
    <policy user="nfc">
        <allow send_destination="org.jmpx448.nfcwifi" send_interface="org.jmpx448.nfcwifi"/>
    </policy>
    <policy user="root">
        <allow send_destination="org.jmpx448.nfcwifi" send_interface="org.jmpx448.nfcwifi"/>
    </policy>
</busconfig>
